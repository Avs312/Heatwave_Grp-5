<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Media & Awareness</title>
</head>

<body style="font-family: Arial, sans-serif; background-color: #f9f9f9;
padding: 20px;">

<h1 style="color: #d9381e;">Heatwave Awareness & Live Media
(Maharashtra)</h1>

<div style="background-color: #fff; padding: 15px; border: 1px solid
#ddd; margin-bottom: 20px; border-radius: 6px;">
<h3 style="color: #333; margin-top: 0;">Heatwave Safety &
Precautionary Guide</h3>
<video width="640" height="360" controls autoplay loop
style="max-width: 100%; height: auto; border-radius: 4px;">
<source src="video.mp4"
type="video/mp4">
Your browser does not support the video element.
</video>
</div>

<div style="background-color: #fff; padding: 15px; border: 1px solid
#ddd; margin-bottom: 20px; border-radius: 6px;">
<h3 style="color: #490000; margin-top: 0;">Regional Audio Advisory
Bulletin</h3>
<audio controls style="width: 100%; max-width: 640px;">
<source src="audio.flac"
type="audio/flac">
Your browser does not support the audio element.
</audio>
</div>

<div style="background-color: #fff; padding: 15px; border: 1px solid
#ddd; margin-bottom: 20px; border-radius: 6px;">
<h3 style="color: #333; margin-top: 0;">Live Portal Embed (IMD Pune
/ Maharashtra Portal)</h3>
<iframe src="https://imdpune.gov.in/" width="100%" height="450" style="border: 1px solid #ccc; border-radius: 4px;" title="IMD Pune /
Maharashtra Weather Portal">
Your browser does not support inline frames.
</iframe>
</div>

<noscript>
<div style="background-color: #ffcdd2; color: #b71c1c; padding:
15px; border: 1px solid #f44336; border-radius: 4px;">
<strong>Notice:</strong> JavaScript is currently disabled in
your browser. Some interactive features on this climate dashboard may have
reduced functionality.
</div>
</noscript>

</body>
</html>
